
# all path with auto join with process CMD

server
{
	# index				index.html
	listen				8089
	server_name			localhost

	root_dir				./www/

	method_allow		GET, POST, DELETE

	# auto_index			enable

	client_max_size		3000000
	# upload_file			enable

	error_page			404		./www/error/404.html
	error_page			405		./www/error/405.html
	error_page			406		./www/error/406.html


	# Simple get auto post fig with index
	location /
	{
		method_allow GET, POST, DELETE
		
	}

	
	# Reqyest TO python cgi
	location /pycgi/
	{
		root_dir		./cgi_bin/py/
		method_allow	GET,POST,DELETE
		cgi_handle 		enable
		cgi_script 		./cgi_bin/py/pycgi.py
	}

	# reuqest to CPP cgi
	# location /ccpcgi/
	# {
	# 	root_dir		./cgi_bin/py/
	# 	method_allow	GET,POST,DELETE
	# 	cgi_handle 		enable
	# 	cgi_script 		./cgi_bin/cpp/ccpcgi.cgi
	# }


	# Request For directory listing
	location /list/
	{
		root_dir		./www/
		auto_index enable
		method_allow	GET,POST,DELETE
	}

	# Serve Static Files
	location /www/
	{
		root_dir ./www/
		method_allow GET
	}

	# upload and download delete file
	location /upload/
	{
		upload_file enable
		upload_path ./www/file/
		method_allow GET, POST, DELETE
	}
}

server 
{
	index						index2.html
	listen				8082
	server_name			localhost
	root_dir				./www/
	method_allow		GET,POST,DELETE
	# directory_list		enable;
	auto_index			disable;
	error_page			404		./www/404.html;
	client_max_size		3000000;

}
