
# all path with auto join with process CMD

server
{
	index				index2.html
	listen				8090
	server_name			localhost

	root_dir				./www/

	method_allow		GET, POST


	auto_index			disable

	client_max_size		3000000

	error_page			404		./www/error/404.html
	error_page			405		./www/error/405.html
	error_page			406		./www/error/406.html


	# Reqyest TO python cgi
	location /pycgi/
	{
		root_dir		./www/
		method_allow	GET,POST,DELETE
		cgi_handle 		enable
		cgi_script 		./cgi_bin/py/pycgi_env.py
	}

	# Serve Static Files
	location /www/
	{
		root_dir ./www/
		method_allow POST
	}

	# upload and download delete file
	location /upload/
	{
		upload_file enable
		upload_path ./www/files/
		root_dir ./www/
		method_allow  POST,DELETE
		error_page 404 ./www/404.html
		index test_post.html
	}

	location /listing/
	{
		root_dir ./www/files/
		method_allow GET
		auto_index enable
		error_page 404 ./www/error/404.html
	}

	location /siege/
	{
		root_dir ./www/
		method_allow GET, POST
		index ./empty.html
	}
}

server
{
	index						index2.html
	listen				8081
	server_name			localhost
	root_dir				./www/
	method_allow		GET,POST,DELETE
	# directory_list		enable;
