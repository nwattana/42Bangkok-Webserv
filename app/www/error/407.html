<!DOCTYPE html>
<!-- Error 407: Proxy Authentication Required - This error indicates that you need to
authenticate with a proxy server before accessing the requested content.
Proxy servers act as intermediaries between your computer and the internet,
and sometimes they require additional login credentials. -->
<html>
	<meta charset="UTF-8">
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: sans-serif;
			background-color: #11284D;
			text-align: center;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}
		h1 {
			font-size: 200px;
			font-weight: 700;
			line-height: 40px;
			top: 100px;
			color: #ffffff;
			-webkit-text-stroke-width: 8px;
	   		-webkit-text-stroke-color: rgb(90, 93, 97);
		}
		h2 {
			font-size: 40px;
			font-weight: 700;
			line-height: 30px;
			color: #ffffff;
			bottom: 30px;
			-webkit-text-stroke-width: 1px;
	   		-webkit-text-stroke-color: rgb(255, 255, 255);
			line-height: 80px;
		}
		h3 {
			font-size: 30px;
			font-weight: 700;
			line-height: 20px;
			letter-spacing: 1px;
			color: #76afdb;
			line-height-step: 10px;
			line-height: 50px;
		}
		.text-box {
			width: 70%;
			max-width: 100%;
			text-overflow: ellipsis;
		}

		@media (max-width: 768px) {
			h2 {
				font-size: 30px;
				line-height: 35px;
			}
			h3 {
				font-size: 20px;
				line-height: 25px;
			}
			.text-box {
				width: 80%;
			}
		}
	</style>
	<body>
		<br>
		<div class="text-box">
			<h1>407</h1>
			<h2>Oops! Proxy Authentication Required &#128577; </h2>
			<h3>Proxy Authentication Required. You need to log in with your proxy server credentials to access this content.</h3>
		</div>
	</body>
</html>
